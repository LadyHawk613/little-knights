<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Knights Chess Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FFF5E1;
    --cream-deep: #FFE5B4;
    --navy: #1B2A4A;
    --navy-soft: #394B75;
    --gold: #FFB703;
    --coral: #FF5964;
    --mint: #2EC4B6;
    --sky: #3A86EF;
    --grape: #8338EC;
    --pink: #FF006E;
    --shadow: rgba(27, 42, 74, 0.25);
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100vh;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: var(--cream);
    font-family: 'Nunito', sans-serif;
    color: var(--navy);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* ---------- Decorative checker strip ---------- */
  .checker-strip{
    display: flex;
    width: 100%;
    height: 12px;
    flex-shrink: 0;
  }
  .checker-strip span{
    flex: 1;
    height: 100%;
  }
  .checker-strip span:nth-child(odd){ background: var(--navy); }
  .checker-strip span:nth-child(even){ background: var(--gold); }

  /* ---------- Hero ---------- */
  .hero{
    padding: 10px 20px 0;
    text-align: center;
    background: radial-gradient(circle at 50% 30%, rgba(255,183,3,0.3) 0, transparent 70%);
    flex-shrink: 0;
  }

  .mascot-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-bottom: 5px;
  }

  .mascot{
    width: 75px;
    height: auto;
    filter: drop-shadow(0 6px 10px var(--shadow));
    animation: bob 2.5s ease-in-out infinite;
  }
  @keyframes bob{
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  h1{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 4.5vw, 3.2rem);
    margin: 0;
    color: var(--navy);
    line-height: 1.1;
  }
  h1 .accent{ color: var(--coral); }

  .subtitle{
    font-size: clamp(0.95rem, 2vw, 1.15rem);
    font-weight: 800;
    color: var(--navy-soft);
    margin: 4px 0 0;
  }

  /* ---------- Activities ---------- */
  .activities{
    max-width: 950px;
    width: 100%;
    margin: 0 auto;
    padding: 0 16px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .activity-btn{
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    color: var(--navy);
    background: #ffffff;
    border: 3px solid var(--card-color, var(--gold));
    border-radius: 18px;
    padding: 14px 18px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.25rem;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--card-color, var(--gold)), 0 8px 15px var(--shadow);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .activity-btn:hover{
    transform: translateY(-3px);
  }
  .activity-btn:active{
    transform: translateY(2px);
    box-shadow: 0 2px 0 var(--card-color, var(--gold)), 0 4px 8px var(--shadow);
  }

  .activity-btn .icon-wrap{
    width: 50px;
    height: 50px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--card-color, var(--gold));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15);
  }
  .activity-btn .icon-wrap svg{ width: 28px; height: 28px; fill: #ffffff; }

  .text-content {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }

  .activity-btn .tag{
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--card-color, var(--gold));
    margin-top: 3px;
  }

  .c1{ --card-color: var(--coral); }
  .c2{ --card-color: var(--mint); }
  .c3{ --card-color: var(--sky); }
  .c4{ --card-color: var(--gold); }
  .c5{ --card-color: var(--grape); }
  .c6{ --card-color: var(--pink); }

  footer{
    text-align: center;
    padding: 10px 20px 16px;
    color: var(--navy-soft);
    font-weight: 800;
    font-size: 1rem;
    flex-shrink: 0;
  }

  @media (max-width: 768px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .activity-btn { padding: 10px 14px; font-size: 1.1rem; }
    .activity-btn .icon-wrap { width: 42px; height: 42px; }
    .activity-btn .icon-wrap svg { width: 22px; height: 22px; }
  }

  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <!-- Top Checker Strip -->
  <div class="checker-strip">
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span>
  </div>

  <!-- Top Hero Header with Title and Mascot -->
  <header class="hero">
    <div class="mascot-container">
      <!-- Friendly Cartoon Chess Knight Image -->
      <svg class="mascot" viewBox="0 0 160 180" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="80" cy="168" rx="46" ry="8" fill="#1B2A4A" opacity="0.2"/>
        <path d="M40 160h80l6-20H34l6 20z" fill="#3A86EF"/>
        <path d="M38 140h84c4-30-6-46-20-58l14-14c-10-8-22-10-30-4l-8 10c-14-8-30-6-42 8-14 16-10 40 2 58z" fill="#FFB703"/>
        <path d="M64 62c10-10 24-12 34-6" stroke="#1B2A4A" stroke-width="5" stroke-linecap="round"/>
        <circle cx="98" cy="70" r="7" fill="#1B2A4A"/>
        <path d="M70 96c8 6 20 6 28 0" stroke="#1B2A4A" stroke-width="5" stroke-linecap="round"/>
        <path d="M60 46c-6-8-4-18 4-22 6 6 6 14 2 20" fill="#FF5964"/>
      </svg>
      <div>
        <h1>Little Knights <span class="accent">Chess Club</span></h1>
        <p class="subtitle">Pick an activity below and let's start our chess adventure! ♞</p>
      </div>
    </div>
  </header>

  <!-- Main Grid Container (No Scrolling) -->
  <main class="activities">
    <div class="grid">

      <!-- Activity 1 -->
      <a class="activity-btn c1" href="#">
        <span class="icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M7 20h10l1-3H6l1 3z"/><path d="M8.5 17h7l1-6-3-2 2-3-3-2-2 3-3-2-2 3 1 3 2 6z"/></svg>
        </span>
        <div class="text-content">
          <span>Meet Pieces</span>
          <span class="tag">Learn</span>
        </div>
      </a>

      <!-- Activity 2 -->
      <a class="activity-btn c2" href="#">
        <span class="icon-wrap">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="#fff" stroke-width="2"/><path d="M4 9h16M9 4v16" stroke="#fff" stroke-width="2"/></svg>
        </span>
        <div class="text-content">
          <span>Puzzle Time</span>
          <span class="tag">Practice</span>
        </div>
      </a>

      <!-- Activity 3 -->
      <a class="activity-btn c3" href="#">
        <span class="icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M12 3c1 3-1 4-1 6s3 2 3 5-3 5-3 7" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/><circle cx="12" cy="20" r="1.6"/></svg>
        </span>
        <div class="text-content">
          <span>Knight's Maze</span>
          <span class="tag">Game</span>
        </div>
      </a>

      <!-- Activity 4 -->
      <a class="activity-btn c4" href="#">
        <span class="icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M6 20h12l1-3H5l1 3z"/><path d="M8 17h8l1-9-5-4-5 4 1 9z"/></svg>
        </span>
        <div class="text-content">
          <span>Checkmate</span>
          <span class="tag">Play</span>
        </div>
      </a>

      <!-- Activity 5 -->
      <a class="activity-btn c5" href="#">
        <span class="icon-wrap">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
        </span>
        <div class="text-content">
          <span>Chess Bingo</span>
          <span class="tag">Game</span>
        </div>
      </a>

      <!-- Activity 6 -->
      <a class="activity-btn c6" href="#">
        <span class="icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 9h6M8 13h8" stroke="#FF006E" stroke-width="1.8" stroke-linecap="round"/></svg>
        </span>
        <div class="text-content">
          <span>Story Time</span>
          <span class="tag">Read</span>
        </div>
      </a>

    </div>
  </main>

  <footer>
    Have fun and think like a champion! ♟️
  </footer>

  <!-- Bottom Checker Strip -->
  <div class="checker-strip">
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span>
  </div>

</body>
</html>
